[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "social-media-toolkit"
version = "0.2.0"
description = "Public SDK, CLI, and MCP toolkit for extracting text, metadata, media, and comments from social posts"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "JNHFlow21", email = "JNHFlow21@users.noreply.github.com"}
]
keywords = [
    "mcp",
    "model-context-protocol",
    "douyin",
    "xiaohongshu",
    "rednote",
    "bilibili",
    "youtube",
    "transcript",
    "asr",
    "ocr",
    "bailian",
    "dashscope",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "requests",
    "ffmpeg-python",
    "tqdm",
    "dashscope",
    "fastapi",
    "uvicorn",
    "jinja2",
    "websockets",
    "python-socks",
    "yt-dlp>=2026.7.4",
]

[project.urls]
Homepage = "https://github.com/JNHFlow21/social-post-extractor-mcp"
Repository = "https://github.com/JNHFlow21/social-post-extractor-mcp"
Issues = "https://github.com/JNHFlow21/social-post-extractor-mcp/issues"

[project.scripts]
social-post-extractor-mcp = "social_post_extractor_mcp.server:main"
social-media-toolkit-mcp = "social_post_extractor_mcp.server:main"
socialkit = "social_media_toolkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["social_media_toolkit", "social_post_extractor_mcp"]
