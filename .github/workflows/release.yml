name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify tag matches package versions
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          python_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          node_version="$(node -p 'require("./package.json").version')"
          test "$expected" = "$python_version"
          test "$expected" = "$node_version"
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          uv build
          npm pack
          sha256sum dist/* social-media-toolkit-*.tgz > SHA256SUMS
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/* social-media-toolkit-*.tgz SHA256SUMS \
            --verify-tag \
            --title "Social Media Toolkit $GITHUB_REF_NAME" \
            --generate-notes

